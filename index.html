<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Travel Sim</title>
  <meta name="theme-color" content="#7b1e3a">
  <meta name="description" content="Drive a Dhaka city bus and fly a light plane over Dhaka and Bandarban.">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <!-- The loading screen paints before any script or stylesheet arrives (src/ui/loader.ts drives it). -->
  <style>
    #loading { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; color: #fff;
      background: radial-gradient(120% 90% at 50% 0%, #7b1e3a 0%, #4a1f45 45%, #2e1a47 100%);
      font-family: "Baloo Da 2", "Noto Sans Bengali", system-ui, sans-serif; transition: opacity .45s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .ld-box { width: min(420px, 100%); text-align: center; }
    #loading .ld-title { margin: 0; font-size: clamp(34px, 7vw, 52px); line-height: 1.1; font-weight: 800; color: #f7c600; text-shadow: 0 3px 0 #7b1e3a, 0 6px 18px rgba(0,0,0,.35); }
    #loading .ld-sub { margin: 4px 0 26px; font-size: 15px; color: #ffe9a8; opacity: .9; }
    #loading .ld-bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.35); }
    #loading .ld-fill { height: 100%; width: 4%; border-radius: 6px; transition: width .35s ease;
      background: repeating-linear-gradient(90deg, #f7c600 0 14px, #16a085 14px 28px, #e74c3c 28px 42px, #2e86c1 42px 56px);
      background-size: 56px 100%; animation: ld-roll 1.1s linear infinite; }
    @keyframes ld-roll { to { background-position: 56px 0; } }
    #loading .ld-status { margin-top: 12px; min-height: 22px; font-size: 15px; color: #fff; }
    #loading .ld-tip { margin-top: 18px; min-height: 40px; font-size: 13px; line-height: 1.5; color: #ffe9a8; opacity: .8; transition: opacity .3s; }
    #loading .ld-version { position: fixed; left: 10px; bottom: 6px; font: 500 11px system-ui, sans-serif; color: #ffe9a8; opacity: .5; }
    @media (prefers-reduced-motion: reduce) { #loading .ld-fill { animation: none; transition: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="ld-box">
      <h1 class="ld-title">ট্রাভেল সিম</h1>
      <p class="ld-sub">Travel Sim · ঢাকা ও বান্দরবান</p>
      <div class="ld-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><div class="ld-fill"></div></div>
      <div class="ld-status">লোড হচ্ছে…</div>
      <div class="ld-tip"></div>
    </div>
    <div class="ld-version"></div>
  </div>
  <script type="module" src="/src/entry.ts"></script>
</body>
</html>
