<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROTOTYPE · Fog, rain, night</title>
<!--
  THROWAWAY PROTOTYPE for wayfinder ticket 024 "Prototype hill fog, rain and night lighting".
  Question: do the chosen time-of-day and weather effects look right in the flat-shaded low-poly
  style, and does each quality tier hold its frame-rate target (30 fps on the minimum phone)?
  A bus drives itself; switch scene / time / weather / quality from the bottom bar and watch the FPS.
  Run: double-click this file (needs internet for the Three.js CDN import).
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font:13px/1.35 system-ui,sans-serif;color:#111}
  canvas{display:block}
  #banner{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#b00020;color:#fff;padding:3px 10px;font-weight:600;border-radius:0 0 6px 6px;z-index:5;white-space:nowrap}
  #stats{position:fixed;top:30px;left:8px;background:rgba(255,255,255,.88);padding:6px 9px;border-radius:8px;font-variant-numeric:tabular-nums;min-width:170px}
  #stats .big{font-size:22px;font-weight:700}
  .ok{color:#1e8449}.bad{color:#c0392b}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px;background:rgba(255,255,255,.9);justify-content:center}
  #bar .grp{display:flex;gap:3px;align-items:center}
  #bar .grp b{margin-right:3px;font-size:12px}
  button{padding:5px 9px;border:1px solid #888;border-radius:5px;background:#fff;cursor:pointer;font:inherit}
  button.on{background:#222;color:#fff}
  button:disabled{opacity:.35;cursor:default}
  #wipers{position:fixed;inset:0;pointer-events:none;display:none}
  #wipers i{position:absolute;bottom:-10vh;width:4px;height:70vh;background:#111;transform-origin:bottom center;animation:wipe 1.1s ease-in-out infinite alternate}
  #wipers i:nth-child(1){left:28%}#wipers i:nth-child(2){left:62%}
  @keyframes wipe{from{transform:rotate(-75deg)}to{transform:rotate(10deg)}}
  @media (max-width:700px){#bar{gap:4px 8px;padding:5px}button{padding:4px 6px;font-size:12px}#stats{font-size:12px}}
</style>
</head>
<body>
<div id="banner">PROTOTYPE: fog, rain, night (throwaway)</div>
<div id="stats"></div>
<div id="wipers"><i></i><i></i></div>
<div id="bar"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---------- settings ----------
const S = {scene:'bandarban', time:'midday', weather:'clear', quality:'medium', view:'chase', paused:false};
const TIERS = {
  low:    {dpr:1,                                  rain:800,  spot:false, sheen:false, fogBank:false, target:30},
  medium: {dpr:Math.min(devicePixelRatio, 1.5),    rain:2000, spot:true,  sheen:true,  fogBank:false, target:30},
  high:   {dpr:Math.min(devicePixelRatio, 2),      rain:4000, spot:true,  sheen:true,  fogBank:true,  target:60},
};
const TIMES = {
  morning: {sky:0xcfe3f0, sun:0xffd8a8, sunI:1.2, sunPos:[600, 250, 300],   hemiI:0.9,  night:false},
  midday:  {sky:0xa9cde0, sun:0xffffff, sunI:1.6, sunPos:[-200, 900, 150],  hemiI:1.1,  night:false},
  golden:  {sky:0xf2c49a, sun:0xffb070, sunI:1.3, sunPos:[-700, 180, -200], hemiI:0.7,  night:false},
  night:   {sky:0x0b1020, sun:0x8fa8ff, sunI:0.15, sunPos:[300, 600, 200],  hemiI:0.15, night:true},
};

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 10, 1000);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.3, 4000);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const hemi = new THREE.HemisphereLight(0xdfefff, 0x5a6a40, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); scene.add(sun);
const lam = c => new THREE.MeshLambertMaterial({color:c, flatShading:true});

// ---------- shared helpers ----------
const hash = (x, z) => { const s = Math.sin(x*127.1 + z*311.7)*43758.5453; return s - Math.floor(s); };
function vnoise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x-xi, zf = z-zi, u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
  const a = hash(xi,zi), b = hash(xi+1,zi), c = hash(xi,zi+1), d = hash(xi+1,zi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; }
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x-e0)/(e1-e0))); return t*t*(3-2*t); };
const roadMatDry = lam(0x4a4a4c), roadMatWet = new THREE.MeshPhongMaterial({color:0x2b2b2e, specular:0x666666, shininess:70, flatShading:true}), roadMatWetLow = lam(0x2e2e30);
const roads = [];
function ribbon(points, width, y = 0.05) {
  const v = [], idx = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[Math.max(0, i-1)], b = points[Math.min(points.length-1, i+1)];
    const t = new THREE.Vector3(b.x-a.x, 0, b.z-a.z).normalize(), r = new THREE.Vector3(-t.z, 0, t.x);
    const p = points[i]; v.push(p.x - r.x*width/2, p.y + y, p.z - r.z*width/2, p.x + r.x*width/2, p.y + y, p.z + r.z*width/2);
    if (i < points.length-1) { const k = i*2; idx.push(k, k+1, k+2, k+1, k+3, k+2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, roadMatDry); roads.push(m); return m;
}

// ---------- Bandarban: hills, a winding climbing road, valley mist ----------
const band = new THREE.Group(); scene.add(band);
const hN = (x, z) => 60 + 150*vnoise(x/420 + 5, z/420 + 9) + 45*vnoise(x/130, z/130);
const bandCurve = (() => {
  const ctrl = []; for (let i = 0; i <= 16; i++) { const t = i/16; ctrl.push(new THREE.Vector3(-700 + 1400*t, 0, 260*Math.sin(t*Math.PI*3))); }
  const flat = new THREE.CatmullRomCurve3(ctrl).getSpacedPoints(400);
  let ys = flat.map(p => hN(p.x, p.z));
  for (let pass = 0; pass < 6; pass++) ys = ys.map((_, i) => { let s = 0, n = 0; for (let j = -8; j <= 8; j++) { const k = i+j; if (k >= 0 && k < ys.length) { s += ys[k]; n++; } } return s/n; });
  const step = flat[0].distanceTo(flat[1]);
  for (let i = 1; i < ys.length; i++) ys[i] = THREE.MathUtils.clamp(ys[i], ys[i-1] - 0.09*step, ys[i-1] + 0.09*step);
  flat.forEach((p, i) => p.y = ys[i]);
  return new THREE.CatmullRomCurve3(flat);
})();
const bandPts = bandCurve.getSpacedPoints(400);
{
  const SIZE = 1800, SEG = 160, g = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); g.rotateX(-Math.PI/2);
  const pos = g.attributes.position, col = new Float32Array(pos.count*3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i); let best = 1e9, by = 0;
    for (let j = 0; j < bandPts.length; j += 2) { const p = bandPts[j], d = (p.x-x)**2 + (p.z-z)**2; if (d < best) { best = d; by = p.y; } }
    const d = Math.sqrt(best), h = THREE.MathUtils.lerp(by - 0.3, hN(x, z), smooth(7, 45, d));
    pos.setY(i, h);
    if (h < 90) c.setHex(0x4f7a3a); else if (h < 160) c.setHex(0x3f6a30); else c.setHex(0x355a2a);
    if (d < 12) c.setHex(0x8a6a45);
    col.set([c.r, c.g, c.b], i*3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  band.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true})));
  band.add(ribbon(bandPts, 6));
  // a few trees for silhouette
  const tg = new THREE.ConeGeometry(4, 14, 5), tm = lam(0x2f5a28), im = new THREE.InstancedMesh(tg, tm, 900), m4 = new THREE.Matrix4();
  let n = 0; for (let k = 0; k < 4000 && n < 900; k++) { const x = (hash(k, 1) - 0.5)*1700, z = (hash(k, 2) - 0.5)*1700;
    let near = false; for (let j = 0; j < bandPts.length; j += 4) if ((bandPts[j].x-x)**2 + (bandPts[j].z-z)**2 < 400) { near = true; break; }
    if (near) continue; m4.makeTranslation(x, hN(x, z) + 6, z); im.setMatrixAt(n++, m4); }
  im.count = n; band.add(im);
}
// valley mist layers (High tier, fog weather)
const mist = new THREE.Group(); band.add(mist);
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 4, 64, 64, 64); grd.addColorStop(0, 'rgba(255,255,255,0.55)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv);
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, fog:true}));
    m.rotation.x = -Math.PI/2; m.position.set((hash(i, 7) - 0.5)*1500, 75 + hash(i, 8)*45, (hash(i, 9) - 0.5)*1500); mist.add(m);
  }
}

// ---------- Dhaka: street, buildings with lit windows, street lights ----------
const dhaka = new THREE.Group(); scene.add(dhaka);
const dhakaPts = Array.from({length:200}, (_, i) => new THREE.Vector3(-400 + i*4, 0, -3.5));
const dhakaCurve = new THREE.CatmullRomCurve3(dhakaPts);
const windowMats = [];
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), lam(0x6f8a4a)); ground.rotation.x = -Math.PI/2; dhaka.add(ground);
  dhaka.add(ribbon([new THREE.Vector3(-450, 0, 0), new THREE.Vector3(450, 0, 0)], 14, 0.02));
  const med = new THREE.Mesh(new THREE.BoxGeometry(900, 0.5, 0.6), lam(0xd9c84a)); med.position.y = 0.25; dhaka.add(med);
  for (let v = 0; v < 3; v++) {
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 128; const g = cv.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 64, 128);
    for (let y = 4; y < 128; y += 12) for (let x = 4; x < 64; x += 12) if (hash(x + v*31, y) < 0.45) { g.fillStyle = hash(x, y + v) < 0.7 ? '#ffd58a' : '#cfe8ff'; g.fillRect(x, y, 7, 7); }
    const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2, 3);
    windowMats.push(new THREE.MeshLambertMaterial({color:[0xd8cbb5, 0xc9a27e, 0xbfbfbf][v], emissive:0xffffff, emissiveMap:tex, emissiveIntensity:0, flatShading:true}));
  }
  for (const side of [-1, 1]) for (let x = -440; x < 440;) {
    const w = 12 + hash(x, side)*14, d = 14 + hash(side, x)*12, h = 8 + hash(x, x)*34;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), windowMats[Math.floor(hash(x, 3)*3)]); b.position.set(x + w/2, h/2, side*(10 + d/2)); dhaka.add(b);
    x += w + 2 + hash(x, 5)*4;
  }
}
const lampSprites = [];
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 1, 32, 32, 32); grd.addColorStop(0, 'rgba(255,220,150,1)'); grd.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  for (let x = -430; x < 440; x += 35) for (const side of [-1, 1]) {
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.25, 8, 0.25), lam(0x555555)); pole.position.set(x, 4, side*8.2); dhaka.add(pole);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, blending:THREE.AdditiveBlending, depthWrite:false, fog:true})); s.scale.set(6, 6, 1); s.position.set(x, 8, side*7.5);
    dhaka.add(s); lampSprites.push(s);
    const pool = new THREE.Mesh(new THREE.CircleGeometry(5, 16), new THREE.MeshBasicMaterial({color:0xffcf88, transparent:true, opacity:0.18, blending:THREE.AdditiveBlending, depthWrite:false}));
    pool.rotation.x = -Math.PI/2; pool.position.set(x, 0.06, side*6); dhaka.add(pool); lampSprites.push(pool);
  }
  for (let i = 0; i < 25; i++) { const p = new THREE.Mesh(new THREE.CircleGeometry(1.5 + hash(i, 4)*2, 10), roadMatWet); p.rotation.x = -Math.PI/2; p.position.set((hash(i, 1) - 0.5)*800, 0.04, -1 - hash(i, 2)*5); p.userData.puddle = true; dhaka.add(p); lampSprites.push(p); }
}

// ---------- the bus, its headlights ----------
const bus = new THREE.Group(); scene.add(bus);
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(11, 2.8, 2.5), lam(0xc0392b)); b.position.y = 1.9; bus.add(b);
  const s = new THREE.Mesh(new THREE.BoxGeometry(11.02, 0.5, 2.52), lam(0x1e8449)); s.position.y = 1.2; bus.add(s);
  const w = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.9, 2.54), lam(0x22313f)); w.position.set(-0.4, 2.4, 0); bus.add(w);
}
const spot = new THREE.SpotLight(0xfff2d0, 0, 120, 0.45, 0.5, 1.2); spot.position.set(5.6, 1.2, 0); bus.add(spot);
const spotTarget = new THREE.Object3D(); spotTarget.position.set(40, -2, 0); bus.add(spotTarget); spot.target = spotTarget;
const cone = new THREE.Mesh(new THREE.ConeGeometry(7, 40, 16, 1, true), new THREE.MeshBasicMaterial({color:0xfff2d0, transparent:true, opacity:0.07, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
cone.rotation.z = Math.PI/2; cone.position.set(25.6, 1.0, 0); bus.add(cone);
const lamps = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.35, 2.0), new THREE.MeshBasicMaterial({color:0xfff2d0})); lamps.position.set(5.52, 1.2, 0); bus.add(lamps);

// ---------- rain: streaks in a box around the camera ----------
let rain = null;
function buildRain(n) {
  if (rain) { scene.remove(rain); rain.geometry.dispose(); }
  const pos = new Float32Array(n*6);
  for (let i = 0; i < n; i++) { const x = (Math.random()-0.5)*80, y = Math.random()*40, z = (Math.random()-0.5)*80; pos.set([x, y, z, x + 0.15, y - 1.1, z], i*6); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rain = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xaab8c8, transparent:true, opacity:0.55, fog:false}));
  rain.frustumCulled = false; scene.add(rain);
}

// ---------- apply the current settings ----------
function apply() {
  const T = TIERS[S.quality], tm = TIMES[S.time];
  renderer.setPixelRatio(T.dpr); renderer.setSize(innerWidth, innerHeight);
  if (S.scene === 'dhaka' && S.weather === 'fog') S.weather = 'clear';
  band.visible = S.scene === 'bandarban'; dhaka.visible = S.scene === 'dhaka';
  const rainy = S.weather === 'rain', foggy = S.weather === 'fog';
  // sky, light, fog colour
  const sky = new THREE.Color(tm.sky); if (rainy) sky.lerp(new THREE.Color(tm.night ? 0x0a0d14 : 0x7d8790), 0.6); if (foggy) sky.lerp(new THREE.Color(tm.night ? 0x1a1f2a : 0xc9ced3), 0.75);
  scene.background = sky; scene.fog.color.copy(sky);
  sun.color.setHex(tm.sun); sun.intensity = tm.sunI * (rainy || foggy ? 0.4 : 1); sun.position.set(...tm.sunPos);
  hemi.intensity = tm.hemiI * (rainy ? 0.7 : 1);
  // visibility (fog distance)
  let far = tm.night ? 600 : 1500; if (rainy) far = 400; if (foggy) far = 220;
  scene.fog.near = foggy ? 15 : far * 0.25; scene.fog.far = far;
  mist.visible = foggy && T.fogBank;
  // night lights
  const lightsOn = tm.night || rainy || foggy;
  windowMats.forEach(m => m.emissiveIntensity = tm.night ? 0.9 : 0);
  lampSprites.forEach(s => s.visible = s.userData.puddle ? rainy : tm.night);
  spot.intensity = lightsOn && T.spot ? (tm.night ? 60 : 25) : 0;
  cone.visible = lightsOn; cone.material.opacity = tm.night ? (T.spot ? 0.06 : 0.11) : 0.04;
  lamps.visible = lightsOn;
  // wet roads
  roads.forEach(r => r.material = rainy ? (T.sheen ? roadMatWet : roadMatWetLow) : roadMatDry);
  // rain particles
  if (rainy) buildRain(T.rain); else if (rain) { scene.remove(rain); rain = null; }
  document.getElementById('wipers').style.display = rainy && S.view === 'cockpit' ? 'block' : 'none';
  renderBar();
}

// ---------- UI ----------
const GROUPS = [
  ['Scene',   'scene',   [['bandarban','Bandarban'], ['dhaka','Dhaka']]],
  ['Time',    'time',    [['morning','Morning'], ['midday','Midday'], ['golden','Golden'], ['night','Night']]],
  ['Weather', 'weather', [['clear','Clear'], ['rain','Rain'], ['fog','Hill fog']]],
  ['Quality', 'quality', [['low','Low'], ['medium','Medium'], ['high','High']]],
  ['View',    'view',    [['chase','Chase'], ['cockpit','Cockpit']]],
];
const bar = document.getElementById('bar');
function renderBar() {
  bar.innerHTML = '';
  for (const [label, key, opts] of GROUPS) {
    const g = document.createElement('div'); g.className = 'grp'; g.innerHTML = `<b>${label}</b>`;
    for (const [val, text] of opts) {
      const b = document.createElement('button'); b.textContent = text; b.className = S[key] === val ? 'on' : '';
      if (key === 'weather' && val === 'fog' && S.scene === 'dhaka') b.disabled = true;
      b.onclick = () => { S[key] = val; apply(); }; g.appendChild(b);
    }
    bar.appendChild(g);
  }
  const p = document.createElement('button'); p.textContent = S.paused ? '▶ Drive' : '⏸ Pause'; p.onclick = () => { S.paused = !S.paused; renderBar(); }; bar.appendChild(p);
}
const statsEl = document.getElementById('stats');
let frames = 0, fpsT = 0, fps = 0;
function renderStats() {
  const T = TIERS[S.quality], info = renderer.info.render;
  statsEl.innerHTML = `<div class="big ${fps >= T.target ? 'ok' : 'bad'}">${fps.toFixed(0)} fps</div>
    Target (${S.quality}): ${T.target} fps<br>Draw calls: ${info.calls} · Tris: ${(info.triangles/1000).toFixed(0)}k<br>
    Pixel ratio: ${T.dpr.toFixed(2)} · ${innerWidth}×${innerHeight}<br>Rain streaks: ${rain ? T.rain : 0}`;
}

// ---------- loop ----------
let u = 0, last = performance.now();
const tmpP = new THREE.Vector3(), tmpT = new THREE.Vector3(), camPos = new THREE.Vector3(), look = new THREE.Vector3();
apply();
window.__S = S; window.__apply = apply; window.__fps = () => fps;
function frame(now) {
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  const curve = S.scene === 'bandarban' ? bandCurve : dhakaCurve, len = curve.getLength();
  if (!S.paused) u = (u + dt * (S.weather === 'rain' ? 8.5 : 10) / len) % 1;
  curve.getPointAt(u, tmpP); curve.getTangentAt(u, tmpT);
  bus.position.copy(tmpP); bus.rotation.set(0, Math.atan2(-tmpT.z, tmpT.x), 0); bus.rotateZ(Math.asin(THREE.MathUtils.clamp(tmpT.y, -1, 1)));
  const flatT = new THREE.Vector3(tmpT.x, 0, tmpT.z).normalize();
  if (S.view === 'chase') { camPos.lerp(tmpP.clone().addScaledVector(flatT, -18).add(new THREE.Vector3(0, 7, 0)), 1 - Math.exp(-dt*3)); camera.position.copy(camPos); look.copy(tmpP).addScaledVector(flatT, 8).add(new THREE.Vector3(0, 2, 0)); }
  else { camera.position.copy(tmpP).addScaledVector(tmpT, 5.2).add(new THREE.Vector3(0, 2.6, 0)); look.copy(camera.position).addScaledVector(tmpT, 30); camPos.copy(camera.position); }
  camera.lookAt(look);
  if (rain) { rain.position.copy(camera.position).add(new THREE.Vector3(0, -15, 0)); const p = rain.geometry.attributes.position.array;
    for (let i = 0; i < p.length; i += 6) { p[i+1] -= 30*dt; p[i+4] -= 30*dt; if (p[i+4] < 0) { p[i+1] += 40; p[i+4] += 40; } } rain.geometry.attributes.position.needsUpdate = true; }
  renderer.render(scene, camera);
  frames++; fpsT += dt; if (fpsT >= 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; renderStats(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__tick = n => { for (let i = 0; i < n; i++) { last = performance.now() - 33; frame(performance.now()); } return {fps, calls:renderer.info.render.calls, tris:renderer.info.render.triangles}; };
</script>
</body>
</html>
